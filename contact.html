<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Contact Us - DairyDelights</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="navbar">
      <div class="menu-bar">
        <div class="logo">
          <img src="assets/images/log.jpg" alt="DairyDelight logo" />
        </div>
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="purchase.html">Product</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="call">
          <a href="tel:+15552347890"><i class="fa-solid fa-phone"></i>+1 (555) 234-7890</a>
        </div>
        <header class="nav-top">
          <span class="hamburger material-icons" id="ham">
            <i class="fa-solid fa-bars"></i>
          </span>
        </header>
        <nav class="nav-drill" id="sidebarMenu">
          <ul class="nav-items nav-level-1">
            <li class="nav-item"><a class="nav-link" href="index.html"> Menu </a></li>
            <li class="nav-item"><a class="nav-link" href="about.html"> About </a></li>
            <li class="nav-item"><a class="nav-link" href="purchase.html"> Products </a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html"> Contact </a></li>
          </ul>
        </nav>
      </div>
    </section>

    <section id="contact" class="section contact">
        <h2>Contact Us</h2>
        <div class="contact-container">
            <div class="contact-info">
                <h3>Our Location</h3>
                <p>123 Dairy Lane, Milk City, Creamland</p>
                <h3>Email</h3>
                <p>hello@dairydelight.example.com</p>
                <h3>Phone</h3>
                <p>+1 (555) 234-7890</p>
            </div>
            <div class="contact-form">
                <!-- Start of form with Basin integration -->
                <form action="https://usebasin.com/f/627e2812e12d" method="POST">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
                <!-- End of form -->
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 DairyDelight. All rights reserved.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
